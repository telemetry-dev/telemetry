name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: bash .github/scripts/release_test.sh
      - run: shellcheck .github/scripts/*.sh

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run test
      - run: pnpm run build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install locked Python dependencies
        run: |
          for package in sdks/python sdks/python-anthropic sdks/python-bedrock sdks/python-google-genai sdks/python-litellm sdks/python-openai sdks/python-openrouter; do
            uv sync --frozen --directory "$package"
          done
      - run: pnpm run py:check
      - run: pnpm run py:test
      - run: pnpm run py:build
