[project]
name = "telemetry-dev"
version = "0.3.6"
description = "telemetry.dev SDK for Python — OpenTelemetry-native GenAI tracing, logs, and metrics"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "telemetry.dev" }]
keywords = ["telemetry", "opentelemetry", "llm", "genai", "tracing", "observability"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "opentelemetry-api>=1.39.0,<2",
  "opentelemetry-sdk>=1.39.0,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.39.0,<2",
  # The OTLP exporter sends with requests, and the ingest answers a refused export with a
  # google.rpc.Status. The exporter requires both; the SDK reads the Status of the response.
  # 1.63.1 is the first release that imports with protobuf 5, which opentelemetry-proto needs.
  # The requests floor of the exporter, 2.7, does not import on Python 3.10; 2.28 does.
  "googleapis-common-protos>=1.63.1,<2",
  "requests>=2.28,<3",
  "rfc8785>=0.1.4",
]

[project.urls]
Homepage = "https://telemetry.dev"
Repository = "https://github.com/telemetry-dev/telemetry"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.9",
  "pyright>=1.1.390",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.pyright]
include = ["src", "tests", "examples"]
typeCheckingMode = "strict"
pythonVersion = "3.10"
